version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: telecomun-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: telecomun_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3307:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - telecomun-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-padmin", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: telecomun-adminer
    ports:
      - "8085:8080"
    depends_on:
      - db
    restart: unless-stopped

  backend:
    build: ./telecomun-backend
    container_name: telecomun-backend
    environment:
      FLASK_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: telecomun_db
      DB_USER: admin
      DB_PASS: admin
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./telecomun-front
      dockerfile: Dockerfile
    container_name: telecomun-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  telecomun-data:
